name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    # Mirrors the Claude Code Stop hook: code changes in a PR must come with doc changes.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Docs updated alongside code
        run: python3 .claude/hooks/docs_guard.py --ci

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: agentflow, POSTGRES_PASSWORD: agentflow, POSTGRES_DB: agentflow }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentflow" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agentflow:agentflow@localhost:5432/agentflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests evals scripts && uv run ruff format --check src tests evals scripts
      - name: Typecheck
        run: uv run mypy src
      - name: Unit + graph e2e tests (LLMs faked)
        run: uv run pytest -q
      - name: Integration tests (Postgres)
        run: uv run pytest -q -m integration

  chat:
    # A separate package with its own lockfile: it must stay installable without agentflow.
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: chat }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, cache-dependency-glob: chat/uv.lock }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Typecheck
        run: uv run mypy src
      - name: Tests (SDK and Telegram faked)
        run: uv run pytest -q

  guide:
    # The guide's routing parity and graph layout sync tests are what catch drift
    # between graph/ and the guide; Vercel only builds, it never runs them.
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: guide }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: guide/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
