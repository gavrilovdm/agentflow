name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    # Mirrors the Claude Code Stop hook: code changes in a PR must come with doc changes.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Docs updated alongside code
        run: python3 .claude/hooks/docs_guard.py --ci

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: agentflow, POSTGRES_PASSWORD: agentflow, POSTGRES_DB: agentflow }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentflow" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agentflow:agentflow@localhost:5432/agentflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests evals && uv run ruff format --check src tests evals
      - name: Typecheck
        run: uv run mypy src
      - name: Unit + graph e2e tests (LLMs faked)
        run: uv run pytest -q
      - name: Integration tests (Postgres)
        run: uv run pytest -q -m integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
