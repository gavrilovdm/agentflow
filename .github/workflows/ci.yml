name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: agentflow, POSTGRES_PASSWORD: agentflow, POSTGRES_DB: agentflow }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentflow" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agentflow:agentflow@localhost:5432/agentflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests evals && uv run ruff format --check src tests evals
      - name: Typecheck
        run: uv run mypy src
      - name: Unit + graph e2e tests (LLMs faked)
        run: uv run pytest -q
      - name: Integration tests (pgvector)
        run: uv run pytest -q -m integration
      - name: Retrieval eval gate
        # Offline embeddings make the dense side noise, so this gates the lexical half of
        # hybrid search; with VOYAGE_API_KEY set it gates the real thing.
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: uv run python -m evals.retrieval_eval --min-recall 0.8

  deploy-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint + render
        run: |
          helm lint deploy/helm/agentflow
          helm template agentflow deploy/helm/agentflow > /dev/null
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt + validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - uses: docker/setup-buildx-action@v3
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
