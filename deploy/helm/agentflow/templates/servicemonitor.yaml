{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "agentflow.name" . }}
  labels: {{- include "agentflow.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  endpoints:
    - { port: http, path: /metrics, interval: 30s }
    - { port: metrics, path: /metrics, interval: 30s }
{{- end }}
