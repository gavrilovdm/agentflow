{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agentflow.name" . }}-secrets
  labels: {{- include "agentflow.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { name: {{ .Values.externalSecret.secretStore }}, kind: ClusterSecretStore }
  target: { name: {{ include "agentflow.name" . }}-secrets }
  data:
    {{- range .Values.externalSecret.keys }}
    - secretKey: {{ . }}
      remoteRef: { key: {{ $.Values.externalSecret.remoteKey }}, property: {{ . }} }
    {{- end }}
{{- end }}
