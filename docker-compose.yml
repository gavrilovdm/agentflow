services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
      POSTGRES_DB: agentflow
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # REDIS_PORT: another Redis on the host (brew) often holds 6379. MCP on the host then needs
    # REDIS_URL=redis://localhost:$REDIS_PORT, or it queues runs no worker will ever see.
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]

  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agentflow:agentflow@postgres:5432/agentflow
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}  # shell env wins over .env (e.g. GITHUB_TOKEN=$(gh auth token))
      CLAUDE_PROXY_URL: http://host.docker.internal:8787/v1
      # Local dev only: empty API_TOKEN / webhook secrets are accepted. Safe because every
      # port is bound to 127.0.0.1; never copy this into a deployment.
      INSECURE_DEV: "true"
      # A laptop has no public URL for Telegram's webhook, so the api pulls updates itself.
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
    ports: ["127.0.0.1:8010:8000"]  # 8000 is often taken locally
    # repos.toml is gitignored, so the image has none: without this mount intake in the
    # container refused every card as "not in the whitelist". create_host_path: false makes a
    # missing file stop `up` instead of Docker creating an empty directory in its place.
    volumes:
      - { type: bind, source: ./repos.toml, target: /app/repos.toml, read_only: true, bind: { create_host_path: false } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: ["arq", "agentflow.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agentflow:agentflow@postgres:5432/agentflow
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}  # shell env wins over .env (e.g. GITHUB_TOKEN=$(gh auth token))
      CLAUDE_PROXY_URL: http://host.docker.internal:8787/v1
      # Stage spans and token metrics (agentflow.telemetry); unset turns the exporters off.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      OTEL_SERVICE_NAME: agentflow-worker
      HUB_ENGINEERING_DIR: /hub/engineering
    volumes:
      - workspaces:/tmp/agentflow
      # SOLID / OOP / clean-code skills shared by every project (agentflow.skills.hub_skills).
      # HUB_DIR defaults to the hub clone next to this repo's parent (~/code/hub).
      - { type: bind, source: "${HUB_DIR:-${HOME}/code/hub}/engineering", target: /hub/engineering, read_only: true, bind: { create_host_path: false } }
      # The same whitelist as the api (see there): intake and the developer check it here.
      - { type: bind, source: ./repos.toml, target: /app/repos.toml, read_only: true, bind: { create_host_path: false } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # OpenTelemetry collector + Tempo (traces) + Prometheus (metrics) + Loki + Grafana in one
  # container. Grafana on :3300 (3000 is usually a dev server). 4318 is open to the host so
  # projects the board builds can send their own telemetry here while developed locally.
  # It keeps days of data, not months: the durable record for analysis is Postgres stage_runs.
  otel:
    image: grafana/otel-lgtm:0.11.10
    ports: ["127.0.0.1:3300:3000", "127.0.0.1:4318:4318"]
    volumes: [lgtm:/data]

volumes:
  pgdata:
  workspaces:
  lgtm:
