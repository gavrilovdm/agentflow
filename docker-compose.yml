services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
      POSTGRES_DB: agentflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agentflow:agentflow@postgres:5432/agentflow
      REDIS_URL: redis://redis:6379
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: ["arq", "agentflow.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agentflow:agentflow@postgres:5432/agentflow
      REDIS_URL: redis://redis:6379
    volumes: [workspaces:/tmp/agentflow]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
  workspaces:
