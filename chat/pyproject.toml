[project]
name = "agentflow-chat"
version = "0.1.0"
description = "Conversational layer over agentflow's MCP server: Claude Agent SDK + Telegram bridge."
readme = "README.md"
requires-python = ">=3.12"
# Deliberately no dependency on agentflow: the MCP server is the only contract, so this
# layer can be swapped for Claude Code / Desktop or another front end without touching it.
dependencies = [
    "claude-agent-sdk>=0.2",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
agentflow-chat = "agentflow_chat.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow_chat"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
