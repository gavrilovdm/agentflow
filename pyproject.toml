[project]
name = "agentflow"
version = "0.1.0"
description = "Multi-agent coding workflow on LangGraph: spec → plan → code → gate → review → PR, with RAG over the target repo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-postgres>=0.0.15",
    "langchain-voyageai>=0.1",
    "langchain-text-splitters>=0.3",
    "langsmith>=0.4",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "arq>=0.26",
    "httpx>=0.27",
    "gitpython>=3.1",
    "pygithub>=2.4",
    "typer>=0.13",
    "rich>=13.9",
    "mcp>=1.2",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "tiktoken>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
agentflow = "agentflow.cli:app"
agentflow-mcp = "agentflow.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["ASYNC109", "ASYNC240", "ASYNC230"]  # short local file reads in a CLI-adjacent agent are fine

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs Postgres", "live: calls real LLM APIs (costs money)"]
addopts = "-m 'not integration and not live'"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
